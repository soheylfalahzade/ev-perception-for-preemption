[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-perception-for-preemption"
version = "0.1.0"
description = "Emergency-vehicle perception for signal preemption: flashing-light cue, map matching, heading, event contract and latency profiling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "soheylfalahzade" }]
keywords = ["intelligent-transportation-systems", "emergency-vehicle", "signal-preemption", "map-matching", "computer-vision"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8", "ultralytics>=8.3"]
sumo = ["eclipse-sumo", "traci"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
evperc-eval = "evperc.evaluate:main"
evperc-sumo = "evperc.sumo_preemption:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
